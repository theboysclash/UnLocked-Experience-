<style>:root {
  color-scheme: dark;
  --bg: #121418;
  --bg-raised: #1b1f27;
  --bg-sunken: #0d0f13;
  --line: #2c3240;
  --text: #e7e8ec;
  --muted: #9aa3b2;
  --faint: #6d7686;
  --accent: #79d8ba;
  --accent-ink: #06241c;
  --danger: #f0837a;
  --warn: #e2b657;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  --sidebar-w: 260px;
  --chat-w: 380px;
  --titlebar-h: 48px;
  --status-h: 28px;
  --font: "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f4f6;
  --bg-raised: #ffffff;
  --bg-sunken: #e6e8ee;
  --line: #d5d8e0;
  --text: #1c1f26;
  --muted: #5c6573;
  --faint: #808898;
  --accent: #0c7d64;
  --accent-ink: #ffffff;
  --shadow: 0 16px 40px rgba(20, 24, 32, 0.12);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
code, pre, .plain-area, .plain-gutter { font-family: var(--mono); }

.app {
  height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar-w) 6px minmax(0, 1fr) 6px var(--chat-w);
  grid-template-rows: var(--titlebar-h) minmax(0, 1fr) var(--status-h);
  grid-template-areas:
    "bar bar bar bar bar"
    "side rs stage rc chat"
    "status status status status status";
}
.app.hide-sidebar { grid-template-columns: 0 0 minmax(0, 1fr) 6px var(--chat-w); }
.app.hide-chat { grid-template-columns: var(--sidebar-w) 6px minmax(0, 1fr) 0 0; }
.app.hide-sidebar.hide-chat { grid-template-columns: 0 0 minmax(0, 1fr) 0 0; }
.hide-sidebar .sidebar, .hide-sidebar .resizer.side,
.hide-chat .chat-panel, .hide-chat .resizer.chat { display: none; }

.titlebar { grid-area: bar; display: flex; align-items: center; gap: 12px; padding: 0 10px; background: var(--bg-sunken); border-bottom: 1px solid var(--line); min-width: 0; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.brand strong { display: block; font-size: 14px; letter-spacing: 0.02em; }
.brand small { color: var(--faint); font-size: 11px; }
.mark { width: 14px; height: 14px; border-radius: 4px; background: conic-gradient(from 120deg, var(--accent), #8eb6ff, var(--accent)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.title-actions { display: flex; gap: 6px; flex: 1; min-width: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.title-actions button { flex: none; }
.title-actions button, .side-actions button, .chat-tools button {
  background: transparent; border: 1px solid transparent; color: var(--muted); border-radius: 6px; padding: 4px 8px; font-size: 12px;
}
.title-actions button:hover, .side-actions button:hover, .chat-tools button:hover { border-color: var(--line); color: var(--text); background: var(--bg-raised); }

.sidebar, .chat-panel { background: var(--bg-sunken); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.sidebar { grid-area: side; border-right: 1px solid var(--line); }
.chat-panel { grid-area: chat; border-left: 1px solid var(--line); }
.stage { grid-area: stage; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; background: var(--bg); }
.statusbar { grid-area: status; display: flex; gap: 14px; align-items: center; padding: 0 10px; background: var(--bg-sunken); border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; overflow: hidden; }
.statusbar span { white-space: nowrap; }
.resizer { background: transparent; }
.resizer.side { grid-area: rs; cursor: col-resize; }
.resizer.chat { grid-area: rc; cursor: col-resize; }
.resizer:hover { background: color-mix(in srgb, var(--accent) 45%, transparent); }

.side-head, .chat-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.side-title { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.side-actions { display: flex; gap: 4px; }
.search-line, .model-line { display: flex; gap: 8px; align-items: center; padding: 8px 10px; }
.search-line input, .model-line input, .field, .plain-area {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
.model-line span { color: var(--faint); font-size: 12px; }
.tree { overflow: auto; padding-bottom: 12px; flex: 1; }
.tree-row, .hit {
  display: flex; width: 100%; text-align: left; gap: 6px; border: 0; background: transparent; color: var(--text);
  padding: 4px 8px; font-size: 13px;
}
.tree-row.active, .tree-row:hover, .hit:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.twisty { width: 12px; color: var(--faint); }
.empty-copy, .hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
.search-hits, .history { max-height: 180px; overflow: auto; border-top: 1px solid var(--line); }
.hidden { display: none !important; }

.tabbar { height: 36px; display: flex; align-items: stretch; background: var(--bg-sunken); border-bottom: 1px solid var(--line); overflow: hidden; }
.tabbar .tab { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); padding: 0 10px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
.tabbar .tab.on { background: var(--bg); color: var(--text); }
.tab-spacer { flex: 1; }
.tab.ghost { border-right: 0; margin-left: auto; }
.tab-x { color: var(--faint); padding: 0 2px; }
.editor-host { flex: 1; min-height: 0; position: relative; }
.editor-host .monaco-editor { position: absolute; inset: 0; }
.plain-editor { display: grid; grid-template-columns: auto 1fr; height: 100%; }
.plain-gutter { margin: 0; padding: 12px 8px; text-align: right; color: var(--faint); background: var(--bg-sunken); overflow: hidden; white-space: pre; line-height: 1.5; font-size: 12px; }
.plain-area { border: 0; border-radius: 0; resize: none; line-height: 1.5; background: var(--bg); outline: none; }

.welcome { position: absolute; inset: 36px 0 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(800px 300px at 20% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%), var(--bg); }
.welcome[hidden] { display: none !important; }
.welcome-card { max-width: 640px; }
.welcome-card h1 { font-size: 34px; line-height: 1.15; margin: 0 0 12px; letter-spacing: -0.03em; }
.eyebrow { color: var(--accent); letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; margin: 0 0 8px; }
.welcome-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }

.transcript { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { border-radius: 10px; padding: 8px 10px; line-height: 1.5; font-size: 14px; }
.msg p { margin: 0 0 8px; }
.msg p:last-child { margin-bottom: 0; }
.msg-user { background: var(--bg-raised); border: 1px solid var(--line); white-space: pre-wrap; }
.msg-assistant { background: transparent; padding-left: 0; }
.msg-tool { background: var(--bg); border: 1px solid var(--line); }
.msg-tool pre { white-space: pre-wrap; max-height: 220px; overflow: auto; margin: 8px 0 0; font-size: 12px; }
.tool-chip { display: inline-block; margin-top: 6px; margin-right: 6px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); font-size: 12px; }
.codeblock { background: var(--bg-sunken); border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; overflow: hidden; }
.codebar { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; color: var(--faint); font-size: 11px; }
.codebar button { background: transparent; border: 0; color: var(--muted); }
.codeblock pre { margin: 0; padding: 8px 10px 12px; overflow: auto; }
.inline { background: var(--bg-sunken); padding: 0 4px; border-radius: 4px; }
.composer { border-top: 1px solid var(--line); padding: 8px; }
.composer textarea { width: 100%; resize: vertical; min-height: 64px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.composer-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.composer-bar .hint { flex: 1; }

.btn { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 650; }
.btn:disabled { opacity: 0.6; cursor: default; }
.icon-btn { background: transparent; border: 0; color: var(--muted); font-size: 20px; line-height: 1; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.46); display: grid; place-items: center; padding: 24px; z-index: 20; }
.modal { width: min(560px, 100%); max-height: min(86vh, 820px); overflow: auto; background: var(--bg-raised); color: var(--text); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.modal-wide { width: min(880px, 100%); }
.modal-header, .modal-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; }
.modal-header { border-bottom: 1px solid var(--line); }
.modal-footer { border-top: 1px solid var(--line); justify-content: flex-end; }
.modal-header h2 { margin: 0; font-size: 16px; }
.modal-body { padding: 14px; }
.settings { display: grid; grid-template-columns: 140px 1fr; gap: 12px; min-height: 320px; }
.tabs-mini { display: flex; flex-direction: column; gap: 4px; }
.tabs-mini .tab { text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 8px; color: var(--muted); }
.tabs-mini .tab.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.card h3 { margin: 0; font-size: 14px; }
.field-label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.area { min-height: 90px; resize: vertical; }
.tall { min-height: 220px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.skill-row { display: flex; justify-content: space-between; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.diff-view { max-height: 420px; overflow: auto; background: var(--bg-sunken); border-radius: 8px; border: 1px solid var(--line); padding: 8px 0; font-family: var(--mono); font-size: 12px; }
.diff-line { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 0 10px; white-space: pre-wrap; }
.diff-add { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.diff-del { background: color-mix(in srgb, var(--danger) 18%, transparent); }
.diff-skip { color: var(--faint); }

#toast-root { position: fixed; right: 14px; bottom: 36px; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
.toast { background: var(--bg-raised); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 12px; box-shadow: var(--shadow); max-width: 360px; }
.toast-warn { border-left-color: var(--warn); }

@media (max-width: 900px) {
  .brand small { display: none; }
  .app, .app.hide-sidebar, .app.hide-chat, .app.hide-sidebar.hide-chat {
    grid-template-columns: 1fr;
    grid-template-areas: "bar" "stage" "status";
  }
  .resizer { display: none; }
  .sidebar, .chat-panel { display: none; position: absolute; z-index: 6; top: var(--titlebar-h); bottom: var(--status-h); width: min(420px, 100%); }
  .sidebar { left: 0; }
  .chat-panel { right: 0; }
  .app.show-sidebar .sidebar, .app.show-chat .chat-panel { display: flex; }
  .settings { grid-template-columns: 1fr; }
  .welcome-card h1 { font-size: 28px; }
}
</style>

      if (signature === 33639248 || signature === 101010256) break;
      if (signature !== 67324752) throw new Error("Not a zip file");
      const flags = readU16(view, offset + 6);
      if (flags & 8) throw new Error("Zip data descriptors are not supported");
      const method = readU16(view, offset + 8);
      const compressedSize = readU32(view, offset + 18);
      const nameLength = readU16(view, offset + 26);
      const extraLength = readU16(view, offset + 28);
      const nameStart = offset + 30;
      const name = new TextDecoder().decode(bytes.subarray(nameStart, nameStart + nameLength));
      const dataStart = nameStart + nameLength + extraLength;
      const dataEnd = dataStart + compressedSize;
      if (dataEnd > bytes.length) throw new Error("Zip entry is truncated");
      let data = bytes.slice(dataStart, dataEnd);
      if (method === 8) data = await inflateRaw(data);
      else if (method !== 0) throw new Error("Only stored or deflated zip entries can be imported");
      if (name && !name.endsWith("/") && !name.split("/").includes("..")) files.push({ name, data });
      offset = dataEnd;
    }
    return files;
  }
  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === "undefined") {
      throw new Error("This zip is compressed and this browser cannot inflate it");
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

    if (raw.theme === "light" || raw.theme === "dark") config2.theme = raw.theme;

      dataList.id = listId;
      document.body.append(dataList);

    model.setAttribute("list", listId);
    function syncModel() {
      const provider = api.config.activeProvider;
      model.value = api.config.providers[provider].defaultModel;
      dataList.replaceChildren();
      for (const item of MODEL_SUGGESTIONS[provider] || []) {

      keyHint.textContent = hasKey ? "" : "Add an API key in Settings";

    });

      event.preventDefault();
      const text = textarea.value;
      if (api.send(text)) textarea.value = "";
    });
    textarea.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

      history.classList.toggle("hidden");

      history.replaceChildren();
      if (!sessions.length) {

        return;

      for (const session of sessions) {

        button.type = "button";

        history.append(button);
      }
    });
    transcript.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-copy]");
      if (!button) return;
      const code = button.closest(".codeblock")?.querySelector("code")?.textContent || "";
      try {
        await navigator.clipboard.writeText(code);
        button.textContent = "Copied";
      } catch {
        button.textContent = "Copy failed";
      }
    });
    function addBubble(role, html, extraClass = "") {
      const article = document.createElement("article");
      article.className = `msg msg-${role} ${extraClass}`.trim();
      article.innerHTML = html;
      transcript.append(article);
      transcript.scrollTop = transcript.scrollHeight;
      return article;
    }
    return {
      syncModel,
      setBusy(busy) {
        stop2.classList.toggle("hidden", !busy);
        form.querySelector("[type=submit]").disabled = busy;
        status.textContent = busy ? "Working" : "Ready";
      },
      notice(text) {
        status.textContent = text;
      },
      clear() {
        transcript.replaceChildren();
        assistantNode = null;
        assistantText = "";
      },
      load(messages) {
        this.clear();
        for (const message of messages) {
          if (message.role === "user") addBubble("user", `<p></p>`).querySelector("p").textContent = message.content;
          else if (message.role === "assistant") {
            const node = addBubble("assistant", markdownToHtml(message.content || ""));
            for (const call of message.toolCalls || []) node.append(toolChip(call));
          } else if (message.role === "tool") addBubble("tool", "", "tool-result").append(toolResult(message));
        }
      },
      addUser(text) {
        const node = addBubble("user", "<p></p>");
        node.querySelector("p").textContent = text;
        assistantNode = null;
      },
      handle(event) {
        if (event.type === "iteration") status.textContent = `Step ${event.index + 1}`;
        if (event.type === "text") {
          if (!assistantNode) {
            assistantText = "";
            assistantNode = addBubble("assistant", "");
          }
          assistantText += event.text;
          if (!frame) {
            frame = requestAnimationFrame(() => {
              frame = 0;
              if (assistantNode) assistantNode.innerHTML = markdownToHtml(assistantText);
              transcript.scrollTop = transcript.scrollHeight;
            });
          }
        }
        if (event.type === "assistant_done") {
          if (!assistantNode) assistantNode = addBubble("assistant", "");
          assistantNode.innerHTML = markdownToHtml(event.message.content || "");
          for (const call of event.message.toolCalls || []) assistantNode.append(toolChip(call));
          if (!event.message.content && !(event.message.toolCalls || []).length && assistantNode) {
            assistantNode.textContent = "No response.";
          }
          assistantNode = null;
          assistantText = "";
        }
        if (event.type === "tool_start") status.textContent = `Running ${event.call.name}`;
        if (event.type === "tool_result") addBubble("tool", "").append(toolResult(event.message));
        if (event.type === "notice") status.textContent = event.text;
      }
    };
  }
  function toolChip(call) {

  }

  function h(tag, attrs = {}, children = []) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value == null || value === false) continue;
      if (key === "class") el.className = value;
      else if (key === "dataset") Object.assign(el.dataset, value);
      else if (key.startsWith("on") && typeof value === "function") {
        el.addEventListener(key.slice(2).toLowerCase(), value);
      } else if (value === true) el.setAttribute(key, "");
      else el.setAttribute(key, String(value));
    }
    const list = Array.isArray(children) ? children : [children];
    for (const child of list) {
      if (child == null || child === false) continue;
      el.append(child.nodeType ? child : document.createTextNode(String(child)));
    }
    return el;
  }

    let root = document.getElementById("toast-root");
    if (!root) {
      root = document.createElement("div");

    }
    const item = document.createElement("div");

    item.textContent = message;
    root.append(item);
    setTimeout(() => item.remove(), 4200);

  function openModal({ title, body, actions = [], wide = false, onClose } = {}) {
    const root = document.getElementById("modal-root");
    const backdrop = h("div", { class: "modal-backdrop" });
    const dialog = h("div", {
      class: `modal${wide ? " modal-wide" : ""}`,
      role: "dialog",
      "aria-modal": "true",
      "aria-label": title
    });
    const header = h("header", { class: "modal-header" }, [
      h("h2", {}, title),
      h("button", { type: "button", class: "icon-btn", "aria-label": "Close", onClick: close }, "×")
    ]);
    const content = h("div", { class: "modal-body" });
    if (typeof body === "string") content.textContent = body;
    else content.append(body);
    const footer = h("footer", { class: "modal-footer" });
    for (const action of actions) {
      footer.append(
        h(
          "button",
          {
            type: "button",
            class: action.primary ? "btn primary" : "btn",
            onClick: () => action.onClick?.({ close })
          },
          action.label
        )
      );
    }
    dialog.append(header, content, footer);
    backdrop.append(dialog);
    root.append(backdrop);
    const previous = document.activeElement;
    dialog.querySelector("button, input, textarea, select")?.focus();
    let closed = false;
    function close() {
      if (closed) return;
      closed = true;
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      if (previous && previous.focus) previous.focus();
      onClose?.();
    }
    function onKey(event) {
      if (event.key === "Escape") close();
    }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("mousedown", (event) => {
      if (event.target === backdrop) close();
    });
    return { close, content, dialog };
  }
  function askText({ title, label, value = "", confirm = "Save" }) {
    return new Promise((resolve) => {
      let settled = false;
      const input = h("input", { class: "field", value, spellcheck: "false" });
      const finish = (result) => {
        if (settled) return;
        settled = true;
        resolve(result);
      };
      const modal = openModal({
        title,
        body: h("label", { class: "field-label" }, [label, input]),
        onClose: () => finish(null),
        actions: [
          { label: "Cancel", onClick: () => {
            finish(null);
            modal.close();
          } },
          {
            label: confirm,
            primary: true,
            onClick: () => {
              finish(input.value.trim());
              modal.close();
            }
          }
        ]
      });
      input.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        finish(input.value.trim());
        modal.close();
      });
      setTimeout(() => input.focus(), 0);
    });
  }
