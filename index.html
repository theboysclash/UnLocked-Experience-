<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumen</title>
    <meta name="description" content="A browser-native AI IDE. Open a folder, edit, and stream an agent with your own API key." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect rx='3' width='16' height='16' fill='%2379d8ba'/%3E%3C/svg%3E" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles/app.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' https: http:; worker-src 'self' blob: data: https://cdn.jsdelivr.net; frame-src blob: data:; base-uri 'none'; object-src 'none'"
    />
  </head>
  <body>
    <div id="app" class="app"></div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <script>
      // Lumen is an ES-module app and must be served over http(s). Opening this file
      // directly (file://) makes the browser block ./src/main.js, leaving a blank page.
      // Guide that case to a served URL or the self-contained standalone.html build.
      if (location.protocol === "file:") {
        document.getElementById("app").innerHTML =
          '<main style="max-width:40rem;margin:12vh auto;padding:0 1.5rem;font:15px/1.6 system-ui,-apple-system,sans-serif;color:#e6e8ec">' +
          '<h1 style="font-size:1.4rem;margin:0 0 .5rem">Open Lumen over a local server</h1>' +
          '<p style="color:#9aa4b2">This is a JavaScript module app, so browsers block it when the file is opened straight from disk (<code>file://</code>). Do one of these:</p>' +
          '<ul style="color:#9aa4b2"><li>Serve this folder: <code>python3 -m http.server 4173</code> then open <a style="color:#79d8ba" href="http://localhost:4173/">http://localhost:4173/</a></li>' +
          '<li>Or open the self-contained build: <a style="color:#79d8ba" href="standalone.html">standalone.html</a></li></ul>' +
          '</main>';
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
